# LIVE CITY room server (CLAUDE.md Phase 8A) — deploys realtime/ to Cloudflare when it changes.
#   push to dev  → staging    (pob-realtime-staging)  → then the security checks run against it
#   push to main → production (pob-realtime)
# Only runs when the room server or the shared message format changed; the website deploys on Vercel as usual.
#
# Repo settings → Secrets and variables → Actions:
#   secrets:   CLOUDFLARE_API_TOKEN (Workers-only token), CLOUDFLARE_ACCOUNT_ID, LOADTEST_SECRET (same as staging's)
#   variables: STAGING_REALTIME_URL (https://pob-realtime-staging.<name>.workers.dev)

name: realtime

on:
  push:
    branches: [dev, main]
    paths:
      - 'realtime/**'
      - 'shared/net/**'
      - '.github/workflows/realtime.yml'
  workflow_dispatch:

concurrency:
  group: realtime-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            realtime/package-lock.json

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix realtime

      - name: Test the message format and movement checks
        run: npm test

      - name: Type-check the room server
        run: npm --prefix realtime run typecheck

      - name: Deploy to ${{ env.TARGET }}
        working-directory: realtime
        run: npx wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Security checks against staging
        if: env.TARGET == 'staging' && vars.STAGING_REALTIME_URL != ''
        working-directory: realtime
        run: npx tsx loadtest/abuse.ts --url "$URL" --secret "$SECRET" --env staging --origin https://peopleofbengaluru-dev.vercel.app
        env:
          URL: ${{ vars.STAGING_REALTIME_URL }}
          SECRET: ${{ secrets.LOADTEST_SECRET }}
